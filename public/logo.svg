<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded square background (Vibrant Violet/Purple) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#5835e4"/>
  
  <!-- House Roof Shadow/Accent (Light blue) -->
  <path d="M 256,110 L 390,222 L 390,238 L 256,126 L 122,238 L 122,222 Z" fill="#d2e0ff"/>
  
  <!-- House Body (White) -->
  <path d="M 256,122 L 378,224 L 378,380 A 10,10 0 0 1 368,390 L 144,390 A 10,10 0 0 1 134,380 L 134,224 Z" fill="#ffffff"/>
  
  <!-- Windows (Light blueish rounded squares) -->
  <rect x="178" y="246" width="38" height="38" rx="6" fill="#e0e8ff"/>
  <rect x="296" y="246" width="38" height="38" rx="6" fill="#e0e8ff"/>
  
  <!-- Door (Dark violet rounded rectangle) -->
  <path d="M 226,306 L 286,306 A 4,4 0 0 1 290,310 L 290,390 L 222,390 L 222,310 A 4,4 0 0 1 226,306 Z" fill="#3f2abf"/>
  
  <!-- Checkmark Badge on bottom right (Orange circle) -->
  <circle cx="376" cy="376" r="64" fill="#ff8c2b"/>
  
  <!-- White checkmark stroke -->
  <path d="M 342,376 L 366,400 L 412,352" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
