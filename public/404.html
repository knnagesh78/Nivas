    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nivas - Redirecting...</title>
    <script>
      // Single Page Apps 404 fallback script: redirect back to root retaining route path
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace("/" + (path.startsWith("/") ? path.substring(1) : path));
    </script>
  </head>
